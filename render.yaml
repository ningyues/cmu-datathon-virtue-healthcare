services:
  - type: web
    name: carelens-public
    runtime: docker
    plan: free
    branch: frontend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABRICKS_HOST
        value: https://dbc-6dd8b941-d971.cloud.databricks.com
      - key: DATABRICKS_AUTH_TYPE
        value: oauth-m2m
      - key: DATABRICKS_CLIENT_ID
        sync: false
      - key: DATABRICKS_CLIENT_SECRET
        sync: false
